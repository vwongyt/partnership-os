<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partnership OS</title>
<style>
  :root{
    --ink:#1c1b19; --ink-2:#55524d; --ink-3:#8a857e;
    --bg:#faf9f7; --card:#ffffff; --line:#e7e4df;
    --accent:#1f5c4d; --accent-soft:#e8f0ed; --accent-line:#cfe0da;
    --warn:#8a2f22; --warn-soft:#fbecea;
    --risk-high:#8a2f22; --risk-med:#8a6a22; --risk-low:#55524d;
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid transparent;transition:.12s}
  .btn-primary{background:var(--accent);color:#fff;padding:11px 18px;font-weight:550}
  .btn-primary:hover{filter:brightness(1.08)}
  .btn-primary:disabled{opacity:.4;cursor:default;filter:none}
  .btn-quiet{background:transparent;color:var(--ink-2);border-color:var(--line);padding:6px 12px;font-size:13px}
  .btn-quiet:hover{background:#fff;color:var(--ink)}

  /* ---------- login ---------- */
  .login{max-width:380px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);
         border-radius:var(--radius);padding:32px}
  .login h1{margin:0 0 6px;font-size:22px;letter-spacing:-0.01em}
  .login p.sub{margin:0 0 26px;color:var(--ink-2);font-size:14px}
  label{display:block;font-size:13px;font-weight:550;color:var(--ink-2);margin:0 0 6px}
  .login input{width:100%;font:inherit;padding:10px 12px;margin-bottom:18px;
        border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  .login input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .login .btn-primary{width:100%}
  .msg{display:none;margin-top:18px;padding:11px 13px;border-radius:8px;font-size:14px;
       background:var(--warn-soft);color:var(--warn);border:1px solid #f0d5d0}
  .msg.show{display:block}
  .note{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);
        font-size:12.5px;line-height:1.5;color:var(--ink-3)}

  /* ---------- app shell ---------- */
  #view-app{display:none;flex-direction:column;height:100%}
  #view-app.on{display:flex}
  .topbar{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line);
          background:var(--card);flex-wrap:wrap}
  .brand{font-size:17px;font-weight:650;letter-spacing:-0.01em;margin-right:6px}
  .tabs{display:flex;gap:4px}
  .tab{background:transparent;border:1px solid transparent;color:var(--ink-2);padding:6px 14px;
       font-size:14px;border-radius:999px}
  .tab:hover{background:var(--bg)}
  .tab.sel{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line);font-weight:550}
  .who{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--ink-2)}

  .pane{flex:1;min-height:0;overflow:auto}
  .pane[hidden]{display:none}
  .measure{max-width:720px;margin:0 auto;padding:28px 24px 8px}

  /* ---------- conversation ---------- */
  .turn{display:flex;margin-bottom:18px}
  .turn.user{justify-content:flex-end}
  /* No percentage max-width here. The column that holds this bubble is sized BY
     the bubble, so a percentage cap is circular: a long message hits the
     column's own 82% first and looks fine, but a short one collapses to the
     width of its widest letter. "yes" rendered as three stacked characters on
     30 July. The column below carries the cap; the bubble just fills it. */
  .bubble{max-width:100%;padding:13px 17px;border-radius:16px;white-space:pre-wrap;overflow-wrap:break-word}
  .turn.user .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:5px}
  .turn.assistant .bubble{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
  .stamp{font-size:11.5px;color:var(--ink-3);margin:5px 3px 0;letter-spacing:.01em}
  .turn.user .stamp{text-align:right}
  .turn .col{display:flex;flex-direction:column;max-width:82%}

  .system{max-width:720px;margin:0 auto 18px;font-size:13.5px;color:var(--ink-2);
          background:var(--accent-soft);border:1px solid var(--accent-line);
          border-radius:10px;padding:11px 15px}
  .system.bad{background:var(--warn-soft);border-color:#f0d5d0;color:var(--warn)}

  /* A "what the thread is holding" block was built and then REMOVED the same
     day, 31 July 2026, at the product owner's request after his first run:
     "I didn't think it was necessary for me to see."

     He was right and the argument for it was wrong. It was justified as the
     only way to catch the model hearing one of two things he said — but the
     read-back paragraph IS that check: it reads everything back, in his own
     language, at the moment it matters. This put a second place to check the
     same thing one turn earlier, in a surface whose whole direction (8.7) is
     fewer things to check. It also listed three items where he had said two
     things, because a fact list is the system's bookkeeping and not his
     sentence.

     The facts are still accumulated in the database and still returned to this
     page (`held` below) — that is what makes retraction visible and it is a
     diagnostic worth having. It just does not occupy his screen unasked. */

  .thinking{display:flex;gap:6px;align-items:center;padding:13px 17px;background:var(--card);
            border:1px solid var(--line);border-radius:16px;border-bottom-left-radius:5px}

  /* Nothing should snap into existence. "Things just close and pop up
     suddenly" — the product owner, on the first full run. A short fade is
     enough to make an arrival read as an arrival rather than a glitch. */
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .q,.closing,.shape,.system,.wrap,.settled li{animation:rise .18s ease-out both}
  @media (prefers-reduced-motion: reduce){
    .q,.closing,.shape,.system,.wrap,.settled li{animation:none}
  }
  .system.working{display:flex;align-items:center;gap:9px}
  .system.working::before{content:"";width:12px;height:12px;border-radius:50%;
    border:2px solid var(--accent-line);border-top-color:var(--accent);
    animation:spin .7s linear infinite;flex:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:bob 1.2s infinite}
  .dot:nth-child(2){animation-delay:.15s}
  .dot:nth-child(3){animation-delay:.3s}
  @keyframes bob{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:.9;transform:translateY(-3px)}}

  .blank{max-width:720px;margin:8vh auto 0;padding:0 24px;text-align:center;color:var(--ink-2)}
  .blank h2{font-size:19px;font-weight:600;color:var(--ink);margin:0 0 10px;letter-spacing:-0.01em}
  .blank p{margin:0 auto;max-width:460px;font-size:14.5px}

  /* ---------- proposed changes, in the conversation ---------- */
  .prop-head{display:flex;align-items:baseline;gap:10px;margin:6px 0 12px}
  .prop-head h3{margin:0;font-size:13px;font-weight:650;letter-spacing:.06em;
                text-transform:uppercase;color:var(--ink-3)}
  .prop-head .count{font-size:13px;color:var(--ink-2)}
  .prop-head .why{margin-left:auto;font-size:12.5px;color:var(--ink-3)}

  .prop{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
        padding:16px 18px;margin-bottom:12px}
  .prop.done{opacity:.62;background:transparent}
  .prop.busy{opacity:.5}
  .prop-tags{display:flex;gap:6px;align-items:center;margin-bottom:11px;flex-wrap:wrap}
  .tag{font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;font-weight:600;
       border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--ink-3);background:#f4f2ef}
  .tag.risk-high{color:#fff;background:var(--risk-high);border-color:var(--risk-high)}
  .tag.risk-medium{color:#fff;background:var(--risk-med);border-color:var(--risk-med)}
  .tag.risk-low{color:var(--ink-2)}
  .tag.unmatched{color:#fff;background:var(--warn);border-color:var(--warn)}

  /* Evidence comes first. Everything else on the card is a claim about it. */
  .ev{border-left:3px solid var(--accent-line);padding:2px 0 2px 13px;margin:0 0 13px;
      color:var(--ink);font-size:15px;font-style:italic}
  .ev .lbl{display:block;font-style:normal;font-size:11.5px;letter-spacing:.05em;
           text-transform:uppercase;color:var(--ink-3);margin-bottom:3px;font-weight:600}

  .what{font-weight:550;margin-bottom:4px}
  .detail{color:var(--ink-2);font-size:14.5px;margin-bottom:4px;white-space:pre-wrap}
  .onto{font-size:13.5px;color:var(--ink-2);margin-bottom:4px}
  .onto b{font-weight:550;color:var(--ink)}
  .impact{font-size:13.5px;color:var(--ink-3);margin-bottom:13px}

  .prop-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn-approve{background:var(--accent);color:#fff;padding:7px 15px;font-size:14px;font-weight:550}
  .btn-approve:hover{filter:brightness(1.08)}
  .btn-reject{background:transparent;color:var(--warn);border-color:#f0d5d0;padding:7px 13px;font-size:14px}
  .btn-reject:hover{background:var(--warn-soft)}
  .verdict{font-size:13.5px;color:var(--ink-2)}
  .verdict b{font-weight:600;color:var(--ink)}

  .edit{margin:0 0 13px;padding:13px;background:var(--bg);border:1px solid var(--line);border-radius:9px}
  .edit label{margin-top:9px}
  .edit label:first-child{margin-top:0}
  .edit input,.edit textarea,.edit select{width:100%;font:inherit;font-size:14.5px;padding:8px 10px;
       border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
  .edit textarea{resize:vertical;min-height:80px;line-height:1.5}
  .edit input:focus,.edit textarea:focus,.edit select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .edit .locked{margin-top:11px;font-size:12.5px;color:var(--ink-3);line-height:1.5}
  .pick{margin:0 0 13px}
  .pick select{width:100%;font:inherit;font-size:14.5px;padding:8px 10px;
       border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
  .prop-err{margin-top:11px;font-size:13.5px;color:var(--warn);background:var(--warn-soft);
            border:1px solid #f0d5d0;border-radius:7px;padding:9px 11px}

  /* ---------- read it back, ask once (Session 8, blueprint 8.7) ---------- */
  /* The paragraph. This is the whole approval surface for a routine set: prose
     the owner reads, one question underneath it, and his own words within reach
     if he wants them. It replaces a stack of forms, which is what he said it
     felt like — "instead of keying in a form, I'm being made to key in approve
     on each field". */
  .readback{background:var(--card);border:1px solid var(--accent-line);
            border-left:4px solid var(--accent);border-radius:var(--radius);
            padding:20px 22px;margin:6px 0 14px}
  .readback.busy{opacity:.5}
  .rb-kind{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:650;
           color:var(--ink-3);margin-bottom:9px}
  /* Deliberately larger and looser than a card. It is meant to be read, and
     one yes now commits everything in it. */
  .rb-prose{margin:0;font-size:16.5px;line-height:1.62;color:var(--ink);letter-spacing:-0.005em}
  .rb-new{font-weight:600}

  /* His own words, one click away and no closer. The evidence sentence is what
     made approving a card mean something; a paragraph has no room for four of
     them without becoming the list it replaced. So it collapses. */
  .rb-src{margin:14px 0 0;font-size:13.5px;color:var(--ink-2)}
  .rb-src summary{cursor:pointer;color:var(--accent);list-style:none;
                  text-decoration:underline;text-underline-offset:2px;width:fit-content}
  .rb-src summary::-webkit-details-marker{display:none}
  .rb-src summary::before{content:"▸ ";text-decoration:none;display:inline-block}
  .rb-src[open] summary::before{content:"▾ "}
  .rb-src ul{margin:11px 0 0;padding:0;list-style:none}
  .rb-src li{padding:8px 0 8px 13px;border-left:3px solid var(--accent-line);
             margin-bottom:9px;font-style:italic;color:var(--ink)}
  .rb-src li:last-child{margin-bottom:0}
  .rb-src li .did{display:block;font-style:normal;font-size:12.5px;color:var(--ink-3);margin-top:4px}

  /* Sticky for the same reason the Session 7 action row was: a paragraph taller
     than the window must still have its answer in reach. Scrolling to read
     should never cost a second scroll to act. */
  .rb-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px;
              position:sticky;bottom:0;background:var(--card);padding:10px 0 2px}
  .btn-yes{background:var(--accent);color:#fff;padding:9px 20px;font-size:15px;font-weight:550}
  .btn-yes:hover{filter:brightness(1.08)}
  .rb-or{font-size:13.5px;color:var(--ink-2)}
  .rb-err{margin-top:12px;font-size:13.5px;color:var(--warn);background:var(--warn-soft);
          border:1px solid #f0d5d0;border-radius:7px;padding:9px 11px}

  /* One question. */
  .q{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
     padding:18px 20px;margin-bottom:12px}
  .q.parent{border-color:var(--accent-line);border-left:4px solid var(--accent)}
  .q.busy{opacity:.5}
  .q-kind{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:650;
          color:var(--ink-3);margin-bottom:7px}
  .q h3{margin:0 0 8px;font-size:17px;font-weight:600;letter-spacing:-0.01em}
  .q-why{margin:0 0 14px;font-size:14px;color:var(--ink-2)}
  /* Sticky, so a question taller than the window still has its answers within
     reach. Scrolling to read should never cost a second scroll to act — which
     is the same complaint that produced bringQuestionIntoView, one case further
     on: there, the question was off screen; here, only its buttons are. */
  .q-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;
             position:sticky;bottom:0;background:var(--card);padding:10px 0 2px}
  .btn-alt{background:#fff;color:var(--ink);border-color:var(--line);padding:7px 14px;font-size:14px}
  .btn-alt:hover{border-color:var(--accent);color:var(--accent)}
  .remaining{font-size:12.5px;color:var(--ink-3);margin:2px 0 16px}
  .wrap{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:var(--radius);
        padding:14px 17px;margin:6px 0 14px;font-size:14.5px;color:var(--ink)}
  .dlbl{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);
        font-weight:600;margin:12px 0 3px}
  .q .detail{margin-bottom:12px}
  .lands{margin:11px 0 0;font-size:14px;color:var(--ink-2)}
  .lands b{color:var(--ink);font-weight:600}
  .btn-link{background:none;border:none;padding:0 0 0 6px;color:var(--accent);font-size:13.5px;
            text-decoration:underline;text-underline-offset:2px}
  .btn-link:hover{filter:brightness(1.2)}

  /* The closing summary. A diary entry, not a status line. */
  .closing{background:var(--card);border:1px solid var(--accent-line);border-left:4px solid var(--accent);
           border-radius:var(--radius);padding:18px 20px;margin:6px 0 14px}
  .closing h3{margin:0 0 12px;font-size:17px;font-weight:600;letter-spacing:-0.01em}
  .closing ul{margin:0 0 12px;padding:0;list-style:none}
  .closing li{padding:6px 0;border-bottom:1px solid var(--line);font-size:14.5px}
  .closing li:last-child{border-bottom:none}
  .closing li em{font-style:normal;color:var(--accent);font-weight:550}
  .closing p{margin:0}
  .closing .drops{font-size:13.5px;color:var(--ink-2);padding-top:10px;border-top:1px solid var(--line)}
  .closing .next{margin-top:12px;font-size:13px;color:var(--ink-3)}
  .evlist{margin:0;padding:0;list-style:none}
  .evlist li{margin-bottom:5px}
  .evlist li:last-child{margin-bottom:0}

  /* ---------- composer ---------- */
  .composer{border-top:1px solid var(--line);background:var(--card);padding:14px 24px 18px}
  .composer-inner{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
  #box{flex:1;font:inherit;resize:none;padding:12px 14px;border:1px solid var(--line);
       border-radius:12px;background:var(--bg);color:var(--ink);max-height:180px;line-height:1.5}
  #box:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);background:#fff}
  .hint{max-width:720px;margin:8px auto 0;font-size:12px;color:var(--ink-3);display:flex;
        justify-content:space-between;gap:12px}

  /* ---------- records ---------- */
  .summary{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
           padding:18px 20px;margin-bottom:22px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .big{font-size:30px;font-weight:650;letter-spacing:-0.02em;line-height:1}
  .summary .lbl{color:var(--ink-2);font-size:14.5px}
  .ws{margin-left:auto;font-size:12px;color:var(--ink-3);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  section.group{margin-bottom:24px}
  h2.gh{margin:0 0 10px;font-size:12.5px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
  h2.gh em{font-style:normal;font-weight:450;text-transform:none;letter-spacing:0}
  ul.rows{list-style:none;margin:0;padding:0;background:var(--card);
          border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  ul.rows li{padding:13px 18px;border-top:1px solid var(--line)}
  ul.rows li:first-child{border-top:none}
  .nm{font-weight:550}
  .props{margin-top:5px;display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:12px;color:var(--ink-2);background:#f4f2ef;border:1px solid var(--line);
        border-radius:999px;padding:2px 9px}
  .chip b{font-weight:550;color:var(--ink-3)}
  .empty{color:var(--ink-2);font-size:14.5px;background:var(--card);border:1px solid var(--line);
         border-radius:var(--radius);padding:22px}
  .loading{color:var(--ink-3);font-size:14.5px;padding:8px 2px}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
</style>
</head>
<body>

<!-- ============ LOGGED OUT ============ -->
<div id="view-login" hidden>
  <form class="login" id="loginForm" autocomplete="on">
    <h1>Partnership OS</h1>
    <p class="sub">Sign in to open your workspace.</p>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <button class="btn-primary" id="loginBtn" type="submit">Sign in</button>
    <div class="msg" id="loginMsg" role="alert"></div>

    <p class="note">
      There is no sign-up. Accounts are created in Supabase by the workspace owner, and an
      account only sees data if it has a person-record in that workspace.
    </p>
  </form>
</div>

<!-- ============ SIGNED IN ============ -->
<div id="view-app">
  <div class="topbar">
    <div class="brand">Partnership OS</div>
    <div class="tabs">
      <button class="tab sel" id="tabChat" type="button">Conversation</button>
      <button class="tab" id="tabRecords" type="button">Records</button>
    </div>
    <div class="who"><span id="whoami"></span><button class="btn-quiet" id="logoutBtn">Sign out</button></div>
  </div>

  <div class="pane" id="paneChat">
    <div class="measure" id="stream"></div>
  </div>

  <div class="pane" id="paneRecords" hidden>
    <div class="measure" id="records"><p class="loading">Loading your records…</p></div>
  </div>

  <div class="composer" id="composer">
    <div class="composer-inner">
      <textarea id="box" rows="1" placeholder="What happened? Write it however you'd say it." aria-label="Your update"></textarea>
      <button class="btn-primary" id="send" type="button" disabled>Send</button>
    </div>
    <div class="hint">
      <span id="stateHint"></span>
      <span>Enter to send · Shift+Enter for a new line</span>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------------------
  // Configuration. The publishable key is public by design: it identifies the
  // project, not the person. Without a signed-in user's token every table and
  // every function answers "permission denied". The secret key never leaves
  // Supabase, and the Anthropic key lives only in Edge Function secrets.
  // ---------------------------------------------------------------------------
  var SUPABASE_URL   = "https://mxizgdnvftwjzgbrhhpa.supabase.co";
  var PUBLISHABLE_KEY = "sb_publishable_a3j9KMGdJlIhTDmj3QaXiw_VZoznxD8";
  var STORE_KEY      = "partnership-os.session";
  var TURN_URL       = SUPABASE_URL + "/functions/v1/chat-turn";

  var $ = function (id) { return document.getElementById(id); };

  var session = null;
  var turns = [];          // [{role, content, created_at}]
  var cards = [];          // proposed changes for the OPEN conversation only
  var candidates = [];     // records the picker can attach an unmatched item to
  var convId = null;
  var busy = false;
  var generating = false;
  var closedNotice = false;
  var recordsLoaded = false;
  var cardError = {};      // id -> a sentence saying why the last decision failed

  // --- Session 10, make the system remember ---------------------------------
  // What the OPEN thread is holding, and where it stands, both read back from
  // the database on every turn. Never inferred from the reply text: the whole
  // 31 July failure was a friendly sentence sitting on top of an empty list.
  var held = [];           // the facts gathered so far in this thread
  var heldStatus = null;   // the conversation status the last call reported

  // --- Session 8, read it back and ask once (blueprint 8.7) -----------------
  // The tree of parent questions is gone. A record that does not exist yet is
  // named inside the paragraph and created by the same yes - the product
  // owner's decision on 30 July - so there is nothing to hold between
  // questions any more. What is left is the state of ONE question.
  var setError = null;     // why the last yes was refused, in a sentence
  var setBusy  = false;    // a yes is in flight
  var createdIds = {};     // "name|type" -> the record id the yes created
  var createdNames = {};   // record name -> created by this thread's yes
  var notices = [];        // sentences the flow has said out loud, in order

  // ---------------------------------------------------------------------------
  // Session storage — unchanged from Session 4b. Inherited, not rebuilt.
  // ---------------------------------------------------------------------------
  function loadSession() {
    try { var raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }
  }
  function saveSession(s) {
    session = s;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) {}
  }
  function clearSession() {
    session = null;
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  }
  function expired(s) {
    if (!s || !s.expires_at) return true;
    return (s.expires_at * 1000) - Date.now() < 60000;
  }

  function authRequest(path, body) {
    return fetch(SUPABASE_URL + "/auth/v1/" + path, {
      method: "POST",
      headers: { "apikey": PUBLISHABLE_KEY, "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        return { ok: r.ok, status: r.status, data: j };
      });
    });
  }
  function signIn(email, password) {
    return authRequest("token?grant_type=password", { email: email, password: password });
  }
  function refresh(refreshToken) {
    return authRequest("token?grant_type=refresh_token", { refresh_token: refreshToken });
  }
  function signOut() {
    var token = session && session.access_token;
    clearSession();
    if (token) {
      fetch(SUPABASE_URL + "/auth/v1/logout", {
        method: "POST",
        headers: { "apikey": PUBLISHABLE_KEY, "Authorization": "Bearer " + token }
      }).catch(function () {});
    }
  }

  // ---------------------------------------------------------------------------
  // Data access
  // ---------------------------------------------------------------------------
  function authHeaders() {
    return {
      "apikey": PUBLISHABLE_KEY,
      "Authorization": "Bearer " + session.access_token,
      "Content-Type": "application/json"
    };
  }

  // ---------------------------------------------------------------------------
  // KEEP THE SESSION ALIVE FOR AS LONG AS THE TAB IS OPEN.
  //
  // Until now the token was refreshed at ONE moment: page load. A Supabase
  // access token lasts an hour. A tab left open outlives it, and then every
  // call fails — which is exactly what happened to the product owner on
  // 30 July: his token had expired 14 minutes earlier, his message was captured
  // and answered, and the generation call came back 401. The page said
  // "Something went wrong (HTTP 401)", which is true and useless.
  //
  // So: check before every call, not once at boot. One refresh in flight at a
  // time, shared by every caller, so six card decisions do not fire six
  // refreshes and race each other.
  // ---------------------------------------------------------------------------
  var refreshing = null;

  function validSession() {
    if (!session) return Promise.reject(new Error("not_signed_in"));
    if (!expired(session)) return Promise.resolve(session);
    if (!session.refresh_token) return Promise.reject(new Error("session_expired"));
    if (!refreshing) {
      refreshing = refresh(session.refresh_token).then(function (res) {
        refreshing = null;
        if (res.ok && res.data && res.data.access_token) { saveSession(res.data); return session; }
        throw new Error("session_expired");
      }, function (e) { refreshing = null; throw e; });
    }
    return refreshing;
  }

  // A session that cannot be revived is not an error to report in the
  // transcript — it is a sign-in screen. Say why, so it does not look like the
  // app broke.
  function sessionDead() {
    clearSession();
    showLogin("Your session expired while the page was open. Please sign in again — nothing was lost.");
  }

  function rpc(fn, args) {
    return validSession().then(function () {
      return fetch(SUPABASE_URL + "/rest/v1/rpc/" + fn, {
        method: "POST", headers: authHeaders(), body: JSON.stringify(args || {})
      });
    }).then(function (r) {
      return r.json().catch(function () { return null; }).then(function (j) {
        if (!r.ok) throw new Error((j && j.message) || ("HTTP " + r.status));
        return j;
      });
    });
  }

  function apiGet(path) {
    return validSession()
      .then(function () { return fetch(SUPABASE_URL + "/rest/v1/" + path, { headers: authHeaders() }); })
      .then(function (r) {
        return r.json().catch(function () { return null; }).then(function (j) {
          if (!r.ok) throw new Error((j && j.message) || ("HTTP " + r.status));
          return j;
        });
      });
  }

  // ---------------------------------------------------------------------------
  // Rendering helpers
  // ---------------------------------------------------------------------------
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function titleCase(s) {
    return String(s || "").replace(/_/g, " ").replace(/\b\w/g, function (c) { return c.toUpperCase(); });
  }
  function clockTime(iso) {
    try {
      return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    } catch (e) { return ""; }
  }

  // A plain-English line for where the conversation stands. The status values
  // are the database's; this is the only place they are translated for a human.
  var STATE_WORDS = {
    gathering:                "Listening.",
    awaiting_clarification:   "Waiting on your answer to the question above.",
    awaiting_permission:      "Waiting on your go-ahead.",
    generating_record_updates:"Working out what should change.",
    record_updates_ready:     "Waiting on your yes — or tell me what’s off.",
    info_delivered:           "Answered — this thread is closed.",
    closed:                   "This thread is closed."
  };

  function setState(status, closed) {
    var s = $("stateHint");
    if (!status) { s.textContent = ""; return; }
    s.textContent = STATE_WORDS[status] || status;
    if (closed && status !== "info_delivered" && status !== "closed") {
      s.textContent += " Thread closed.";
    }
  }

  // ---------------------------------------------------------------------------
  // A proposed change, in English rather than in schema.
  // ---------------------------------------------------------------------------
  function targetName(c) {
    return c.resolved_object_name || c.entity_name || "an unnamed record";
  }

  function whatLine(c) {
    var ch = c.change || {};
    if (c.type === "note") return "Add a note to " + targetName(c);
    if (c.type === "property_update")
      return "Set " + titleCase(ch.field) + " to “" + (ch.to == null ? "" : ch.to) + "”";
    if (c.type === "task") return "Create a task — " + (ch.title || c.summary || "");
    return c.summary || c.type;
  }

  function detailLine(c) {
    var ch = c.change || {}, bits = [];
    if (c.type === "note") return ch.note_text || "";
    if (c.type === "property_update") {
      if (ch.from != null && ch.from !== "") return "Currently “" + ch.from + "”.";
      return "";
    }
    if (c.type === "task") {
      if (ch.suggested_due) bits.push("Due " + ch.suggested_due);
      if (ch.suggested_owner) bits.push("Suggested owner: " + ch.suggested_owner);
      return bits.join(" · ");
    }
    return "";
  }

  // ---------------------------------------------------------------------------
  // READ IT BACK, ASK ONCE. Blueprint 8.7.
  //
  // Session 7 asked one question per change, and the product owner's verdict
  // after using it on his own records was that it "felt like just instead of
  // keying in a form, I'm being made to key in approve on each field."
  // Constitution B4 requires that a human decides. It does not require that the
  // human decides four times.
  //
  // So the surface is a paragraph. THE PARAGRAPH IS ASSEMBLED FROM THE CHANGES
  // THEMSELVES - one clause carried on each pending row - and not written as a
  // second, free-prose account of the same facts. That is what makes refusal
  // S8-1 structural rather than promised: a clause cannot exist without a change
  // behind it, and a change whose clause is missing is refused by the database
  // rather than quietly swept into the paragraph. The ids of exactly the changes
  // whose clauses are on screen are what the yes sends, and chat_apply_set
  // refuses the whole call if the conversation holds any other pending item.
  // ---------------------------------------------------------------------------
  function bySeq(a, b) { return (a.seq || 0) - (b.seq || 0); }

  function pendingAll() {
    var out = [], i;
    for (i = 0; i < cards.length; i++) if (cards[i].status === "pending") out.push(cards[i]);
    return out;
  }
  function pendingCount() { return pendingAll().length; }

  // The set: everything routine, in the order it was said.
  function setCards() {
    return pendingAll().filter(function (c) { return c.risk !== "high"; }).sort(bySeq);
  }
  // Pulled out and asked on its own. Today that is exactly a move to Won or
  // Dropped, because that is what the risk rule calls high. The pull-out follows
  // the RULE rather than keeping a second list of its own, so if the rule ever
  // grows another high case this follows it without being edited.
  function riskyCards() {
    return pendingAll().filter(function (c) { return c.risk === "high"; }).sort(bySeq);
  }

  function clauseOf(c) {
    return String(c.read_back || c.summary || whatLine(c) || "").trim();
  }

  // Where a change should land. A change that resolved goes to its record; a
  // change whose record the yes has just created goes to the record the yes
  // created. Never a guess.
  function targetFor(c) {
    if (c.resolved_object_id) return c.resolved_object_id;
    var k = String(c.entity_name || "").trim().toLowerCase() + "|" +
            String(c.entity_type || "partner").toLowerCase();
    return createdIds[k] || null;
  }

  // REFUSAL S8-7. A new record is covered by the same yes - the product owner's
  // decision on 30 July, because pulling it out would fire in nearly every
  // conversation and turn 8.7 back into the thing it exists to remove. The price
  // of that decision is this check: the paragraph must NAME the record and say
  // it is new. If a clause for a new record does not name it, the yes is not
  // offered at all. Asking dishonestly is worse than not asking.
  function newRecordsUnnamed() {
    var out = [], s = setCards(), i, c, nm;
    for (i = 0; i < s.length; i++) {
      c = s[i];
      if (c.resolved_object_id) continue;
      nm = String(c.entity_name || "").trim();
      if (!nm) { out.push("an unnamed record"); continue; }
      if (clauseOf(c).toLowerCase().indexOf(nm.toLowerCase()) === -1) out.push(nm);
    }
    return out;
  }

  function paragraphHtml() {
    var s = setCards(), i, t, parts = [];
    if (!s.length) return "";
    for (i = 0; i < s.length; i++) {
      t = clauseOf(s[i]);
      if (!t) continue;
      // A clause about a record that does not exist yet is set slightly heavier,
      // because it is the one sentence in the paragraph that creates something.
      parts.push(s[i].resolved_object_id
        ? escapeHtml(t)
        : '<span class="rb-new">' + escapeHtml(t) + "</span>");
    }

    var h = '<div class="readback' + (setBusy ? " busy" : "") + '">' +
            '<div class="rb-kind">Here is what I understood</div>' +
            '<p class="rb-prose">' + parts.join(" ") + "</p>";

    h += evidenceHtml(s);

    var missing = newRecordsUnnamed();
    if (missing.length) {
      h += '<div class="rb-err">I am not going to ask you to approve this as it stands. ' +
           escapeHtml(missing.join(", ")) +
           (missing.length === 1 ? " is not in your records" : " are not in your records") +
           ", and saying yes would create " + (missing.length === 1 ? "it" : "them") +
           " — but the summary above does not say so, and it should. " +
           "Tell me what you want to do in your own words instead.</div>";
    } else {
      h += '<div class="rb-actions">' +
           '<button class="btn-yes" data-act="yes">Yes, that’s right</button>' +
           '<span class="rb-or">or tell me what’s off, in the box below</span>' +
           "</div>";
    }
    if (setError) h += '<div class="rb-err">' + escapeHtml(setError) + "</div>";
    return h + "</div>";
  }

  // Your own words, one click away and no closer. Your choice on 30 July, over
  // prose-only and over quoting one sentence inline. The verbatim sentence is
  // what made approving a card mean something; a paragraph has no room for four
  // of them without becoming the list it replaced.
  function evidenceHtml(list) {
    var i, j, facts, any = false;
    var h = '<details class="rb-src"><summary>what I based this on</summary><ul>';
    for (i = 0; i < list.length; i++) {
      facts = (Array.isArray(list[i].evidence_facts) && list[i].evidence_facts.length)
                ? list[i].evidence_facts
                : (list[i].evidence ? [list[i].evidence] : []);
      for (j = 0; j < facts.length; j++) {
        any = true;
        h += "<li>" + escapeHtml(facts[j]) +
             '<span class="did">' + escapeHtml(whatLine(list[i])) + "</span></li>";
      }
    }
    return any ? h + "</ul></details>" : "";
  }

  // The one thing that is never inside a set. Asked AFTER the set, deliberately,
  // because the set may have just created the record this is about.
  function riskyHtml(c) {
    var t = targetFor(c), ch = c.change || {}, to = String(ch.to == null ? "" : ch.to);
    var h = '<div class="q" data-card="' + escapeHtml(c.id) + '">' +
            '<div class="q-kind">One more, on its own</div>' +
            "<h3>" + escapeHtml(clauseOf(c)) + "</h3>" +
            '<p class="q-why">This one moves the deal to ' + escapeHtml(to) +
            ", which is a judgement about the deal rather than a record of what happened. " +
            "It is always asked on its own and can never be folded into a summary.</p>";
    h += evidenceHtml([c]);
    if (t) h += '<div class="onto">On <b>' + escapeHtml(targetName(c)) + "</b></div>";
    else   h += '<div class="onto">This is not attached to any record, so approving it ' +
                "would change nothing.</div>";
    h += '<div class="q-actions">' +
         '<button class="btn-approve" data-act="approve" data-id="' + escapeHtml(c.id) + '">' +
         escapeHtml(to ? "Yes, mark it " + to : "Yes, do it") + "</button>" +
         '<button class="btn-reject" data-act="reject" data-id="' + escapeHtml(c.id) + '">Not yet</button>' +
         "</div>";
    if (cardError[c.id]) h += '<div class="prop-err">' + escapeHtml(cardError[c.id]) + "</div>";
    return h + "</div>";
  }

  // What a finished thread should say. The product owner's words after his first
  // real run: "when i finish the action, i think a summary closing of what has
  // been done is better." He is describing a diary entry. So: grouped by the
  // record it happened to, in his language, counting only what actually changed
  // - and saying plainly what was dropped, because a rejection is a decision he
  // made and should be visible, not an absence.
  function phrase(n, word) { return n + " " + word + (n === 1 ? "" : "s"); }

  function closingHtml() {
    var byRecord = {}, order = [], dropped = [], i, c, name, b;
    for (i = 0; i < cards.length; i++) {
      c = cards[i];
      name = c.resolved_object_name || c.entity_name || "an unnamed record";
      if (c.status === "rejected") { dropped.push(whatLine(c)); continue; }
      if (c.status !== "applied") continue;
      if (!byRecord[name]) { byRecord[name] = { notes: 0, tasks: 0, props: [] }; order.push(name); }
      b = byRecord[name];
      if (c.type === "note") b.notes++;
      else if (c.type === "task") b.tasks++;
      else if (c.type === "property_update") {
        b.props.push(titleCase((c.change || {}).field) + " set to “" + ((c.change || {}).to || "") + "”");
      }
    }

    var h = '<div class="closing"><h3>That’s this one wrapped up.</h3>';
    if (!order.length) {
      h += "<p>Nothing on your records changed — everything here was dropped.</p>";
    } else {
      h += "<ul>";
      for (i = 0; i < order.length; i++) {
        b = byRecord[order[i]];
        var bits = [];
        if (b.notes) bits.push(phrase(b.notes, "note") + " added");
        if (b.tasks) bits.push(phrase(b.tasks, "task") + " created");
        if (b.props.length) bits.push(b.props.join(", "));
        h += "<li><b>" + escapeHtml(order[i]) + "</b>" +
             (createdNames[order[i]] ? " — <em>added as a new record</em>" : "") +
             " · " + escapeHtml(bits.join(" · ")) + "</li>";
      }
      h += "</ul>";
    }
    if (dropped.length) {
      h += '<p class="drops">' + escapeHtml(phrase(dropped.length, "change") +
           " dropped, nothing changed: " + dropped.join("; ")) + "</p>";
    }
    h += '<p class="next">Every one of these is on your records now, with an event recording what it ' +
         "looked like before and after. Your next message starts a new thread.</p>";
    return h + "</div>";
  }

  // The paragraph first. The pulled-out questions after it, one at a time,
  // because answering the set can create the record one of them is about.
  function cardsHtml() {
    if (!cards.length) return "";
    var h = "", i;
    for (i = 0; i < notices.length; i++) h += '<div class="wrap">' + escapeHtml(notices[i]) + "</div>";
    if (!pendingCount()) return h + closingHtml();
    if (setCards().length) return h + paragraphHtml();
    return h + riskyHtml(riskyCards()[0]);
  }

  // keepScroll: hold the reader where they are instead of jumping to the
  // bottom. A new message should pull the view down; deciding on a card should
  // not. Without this, approving the third card of six threw the page to the
  // end of the transcript and the next card had to be scrolled back to - once
  // per decision, every time. Found by the product owner, 30 July.
  function renderStream(pending, keepScroll) {
    var html = "", i, t;
    if (!turns.length && !pending && !cards.length) {
      $("stream").innerHTML =
        '<div class="blank"><h2>Nothing on the go.</h2>' +
        '<p>Tell me what happened — a call, a meeting, a note to self. Write it the way ' +
        'you would say it out loud. I will read it back and check what I understood ' +
        'before anything touches your records.</p></div>';
      return;
    }
    function turnHtml(t) {
      return '<div class="turn ' + (t.role === "user" ? "user" : "assistant") + '">' +
               '<div class="col">' +
                 '<div class="bubble">' + escapeHtml(t.content) + "</div>" +
                 '<div class="stamp">' + escapeHtml(clockTime(t.created_at)) + "</div>" +
             "</div></div>";
    }

    // ANYTHING IN FLIGHT GOES LAST. This looks like a cosmetic ordering choice
    // and is not: it was a real bug, found by the product owner on his first
    // full run and then reproduced exactly. The message you have just sent was
    // rendered with the earlier turns, ABOVE the finished thread's cards and
    // closing summary — and the page then scrolled to the bottom, which is the
    // summary. The "thinking" dots were drawn 164 pixels ABOVE the visible
    // window. So you typed, the screen jumped to old content, and nothing
    // appeared to be happening. His reading of the screen was correct; the
    // screen was wrong.
    //
    // A message sent after a thread wraps up genuinely comes after it, so the
    // pending turn and its indicator belong at the end.
    var upTo = turns.length - (pending && turns.length ? 1 : 0);
    for (i = 0; i < upTo; i++) html += turnHtml(turns[i]);
    html += cardsHtml();
    // Only when there is no closing summary — otherwise this repeats its last
    // line in a flatter voice.
    if (closedNotice && !(cards.length && pendingCount() === 0)) {
      html += '<div class="system">This thread is closed. Your next message starts a new one.</div>';
    }
    if (pending && turns.length) {
      html += turnHtml(turns[turns.length - 1]) +
              '<div class="turn assistant"><div class="col"><div class="thinking">' +
              '<span class="dot"></span><span class="dot"></span><span class="dot"></span>' +
              "</div></div></div>";
    }
    // The reply arrives first and the proposals follow a moment later, so this
    // line is what fills the second wait rather than leaving it blank.
    if (generating) {
      html += '<div class="system working">Working out what should change…</div>';
    }
    // The box asks a different question when something is waiting on an answer.
    // Leaving it on "what happened?" while the screen asks "does that look
    // right?" is the same class of leak as Session 7's Edit dropdown: a surface
    // from the previous design still speaking, one layer on.
    $("box").placeholder = (convId && pendingCount() > 0)
      ? "Tell me what’s off — in your own words"
      : "What happened? Write it however you'd say it.";
    var p = $("paneChat");
    var was = p.scrollTop;
    $("stream").innerHTML = html;
    p.scrollTop = keepScroll ? was : p.scrollHeight;
    if (keepScroll) bringQuestionIntoView();
  }

  // Hold the reader in place, but not at the cost of hiding the thing they now
  // have to answer. keepScroll exists because approving the third card of six
  // used to throw the page to the end of the transcript (found by the product
  // owner, 30 July). One question at a time changed the arithmetic: the settled
  // list grows by a line with every answer, so the NEXT question drifts below
  // the fold and has to be scrolled to — once per decision, every time. Found
  // by the product owner on his first real run of this surface, same day.
  //
  // So: don't jump anywhere if the question is already comfortably in view.
  // Otherwise move the minimum needed to show it, with a little headroom so it
  // never sits flush against an edge. A question taller than the pane is
  // aligned to its top, because its first line is the part you read first.
  function bringQuestionIntoView() {
    var p = $("paneChat"), q = $("stream").querySelector(".readback, .q");
    if (!q || p.hidden) return;
    var qr = q.getBoundingClientRect(), pr = p.getBoundingClientRect();
    var pad = 14, delta = 0;
    if (qr.height >= pr.height - pad * 2) {
      if (qr.top < pr.top - 1 || qr.top > pr.top + pad) delta = qr.top - pr.top - pad;
    } else if (qr.top < pr.top + pad) {
      delta = qr.top - pr.top - pad;
    } else if (qr.bottom > pr.bottom - pad) {
      delta = qr.bottom - pr.bottom + pad;
    }
    if (delta) p.scrollTop += delta;
  }

  function systemNote(text, bad) {
    var d = document.createElement("div");
    d.className = "system" + (bad ? " bad" : "");
    d.textContent = text;
    $("stream").appendChild(d);
    var p = $("paneChat");
    p.scrollTop = p.scrollHeight;
  }

  // ---------------------------------------------------------------------------
  // A turn. ONE request from this laptop. The Edge Function does the capture,
  // the Claude call and the write-back next to the database.
  // ---------------------------------------------------------------------------
  function sendTurn(text) {
    busy = true;
    $("send").disabled = true;
    $("box").disabled = true;
    // Say something where they are already looking. The indicator in the
    // transcript can be scrolled away from; the line under the box cannot.
    $("stateHint").textContent = "Reading what you wrote…";
    turns.push({ role: "user", content: text, created_at: new Date().toISOString() });
    renderStream(true);

    validSession().then(function () {
      return fetch(TURN_URL, {
        method: "POST", headers: authHeaders(), body: JSON.stringify({ message: text })
      });
    }).then(function (r) {
      return r.json().catch(function () { return null; }).then(function (j) {
        return { status: r.status, data: j };
      });
    }).then(function (res) {
      var d = res.data;
      if (d && d.ok === true) {
        // Replace the optimistic copy with what the database actually stored.
        turns[turns.length - 1] = d.user_message;
        turns.push(d.assistant_message);
        convId = d.conversation_id;
        closedNotice = !!d.closed;
        setState(d.status, d.closed);
        // Session 10. What the thread holds AFTER this turn, from the database.
        held = Array.isArray(d.candidate_facts) ? d.candidate_facts : [];
        heldStatus = d.status || null;
        // A new thread starts with no proposals of its own, and with none of
        // the previous thread's answers to parent questions.
        if (!d.resumed) {
          cards = []; notices = []; createdIds = {}; createdNames = {};
          setError = null; setBusy = false;
        }
        generating = d.generate === true;
        renderStream(false);
        if (d.generate === true) askForProposals(d.conversation_id);
      } else {
        renderStream(false);
        systemNote(explain(res.status, d), true);
      }
    }).catch(function (err) {
      renderStream(false);
      if (err && /session_expired|not_signed_in/.test(err.message)) { sessionDead(); return; }
      systemNote("Could not reach the server. Your message was not saved — try again.", true);
    }).then(function () {
      busy = false;
      $("box").disabled = false;
      $("send").disabled = !$("box").value.trim();
      // Put the state line back to whatever the conversation now says. setState
      // has already run on the success path; on a failure path the hint would
      // otherwise be left claiming to still be reading.
      if ($("stateHint").textContent === "Reading what you wrote…") setState(null);
      $("box").focus();
    });
  }

  // ---------------------------------------------------------------------------
  // The second half of a go-ahead: turn the gathered facts into proposals.
  //
  // Fired only when the turn above reported generate: true — which the database
  // sets only on the TRANSITION into "go ahead", never on the state. If this
  // request were sent twice anyway, the database refuses the second one: the
  // insert only runs while the conversation is still awaiting generation, and
  // the same statement moves it past that. Two independent locks.
  // ---------------------------------------------------------------------------
  function askForProposals(conversationId) {
    validSession().then(function () {
      return fetch(TURN_URL, {
        method: "POST", headers: authHeaders(),
        body: JSON.stringify({ action: "generate", conversation_id: conversationId })
      });
    }).then(function (r) {
      return r.json().catch(function () { return null; }).then(function (j) {
        return { status: r.status, data: j };
      });
    }).then(function (res) {
      var d = res.data;
      generating = false;
      if (d && d.ok === true) {
        cards = Array.isArray(d.record_updates) ? d.record_updates : [];
        candidates = Array.isArray(d.candidates) ? d.candidates : [];
        closedNotice = !!d.closed;
        setState(d.status, d.closed);
        if (Array.isArray(d.candidate_facts)) held = d.candidate_facts;
        heldStatus = d.status || null;
        renderStream(false);
        // REFUSAL S9-4, the honest empty case. Facts were there, the model read
        // them, and nothing in them changes a record. That is the system
        // working. It must NOT read like the broken case below — his decision
        // of 31 July, and the reason is that one sentence covering both would
        // train him to skip the sentence. So this one names what it is holding
        // and says the thread is still open, and it is not marked as a fault.
        if (!cards.length) {
          var n = (held.length === 1)
            ? "I have one thing from you in this thread — “" + String(held[0]) + "” — and " +
              "nothing in it changes a record, so I have not proposed anything. " +
              "This thread is still open: add more and I will look again."
            : "I have " + held.length + " things from you in this thread and nothing in them " +
              "changes a record, so I have not proposed anything. They are still held and " +
              "this thread is still open — add more and I will look again.";
          systemNote(held.length ? n
                                 : "Nothing in that needed a change to your records, so I have not " +
                                   "proposed any. This thread is still open.", false);
        }
      } else {
        // REFUSAL S12, and now S9-3 as well. Never silence. The reply already
        // said proposals were being worked out, so if they were not, that has
        // to be said plainly — and the thread is left open either way.
        renderStream(false);
        systemNote(explain(res.status, d), true);
      }
    }).catch(function (err) {
      generating = false;
      renderStream(false);
      if (err && /session_expired|not_signed_in/.test(err.message)) { sessionDead(); return; }
      systemNote("Your message is saved, but I could not reach the server to work out the proposed changes. " +
                 "Nothing on your records has changed.", true);
    });
  }

  // ---------------------------------------------------------------------------
  // ANSWERING. Blueprint 8.7. Two ways to answer, and they are deliberately
  // different code paths rather than one with a flag.
  //
  //   The button  - unambiguous, so it costs no model call and no wait.
  //   Your words  - always read by the model first, and can only become an
  //                 approval if it asks for nothing at all to be changed.
  //
  // REFUSAL S8-2 lives in the Edge Function, not here, and deliberately so: a
  // guard that decides whether "yes but drop the task" applies the task must not
  // sit in a browser, where a stale page could route around it.
  // ---------------------------------------------------------------------------
  function findCard(id) {
    for (var i = 0; i < cards.length; i++) if (cards[i].id === id) return cards[i];
    return null;
  }
  function setCardBusy(id, on) {
    var el = document.querySelector('[data-card="' + id + '"]');
    if (el) el.classList.toggle("busy", !!on);
  }

  function postTurn(body) {
    return validSession().then(function () {
      return fetch(TURN_URL, {
        method: "POST", headers: authHeaders(), body: JSON.stringify(body)
      });
    }).then(function (r) {
      return r.json().catch(function () { return null; }).then(function (j) {
        return { status: r.status, data: j };
      });
    });
  }

  // What the yes sends: exactly the ids whose clauses are in the paragraph on
  // screen. If the conversation holds anything else still pending, the database
  // refuses the whole call (S8-1) rather than applying a subset of an answer.
  function answerYes() {
    if (setBusy || busy) return;
    var s = setCards(), ids = [], i;
    for (i = 0; i < s.length; i++) ids.push(s[i].id);
    if (!ids.length) return;
    setError = null;
    setBusy = true;
    renderStream(false, true);
    postTurn({ action: "answer", conversation_id: convId, affirm: true, record_update_ids: ids })
      .then(function (res) { handleApply(res, ids); })
      .catch(function (err) {
        setBusy = false;
        if (err && /session_expired|not_signed_in/.test(err.message)) { sessionDead(); return; }
        setError = "Could not reach the server, so nothing was applied and nothing on your " +
                   "records has changed. (" + err.message + ")";
        renderStream(false, true);
      });
  }

  function handleApply(res, ids) {
    var d = res.data, made, i, k;
    setBusy = false;
    if (d && d.ok === true) {
      for (i = 0; i < cards.length; i++)
        if (ids.indexOf(cards[i].id) !== -1) cards[i].status = "applied";
      made = Array.isArray(d.records_created) ? d.records_created : [];
      for (i = 0; i < made.length; i++) {
        k = String(made[i].name || "").trim().toLowerCase() + "|" +
            String(made[i].object_type || "partner").toLowerCase();
        createdIds[k] = made[i].id;
        createdNames[made[i].name] = true;
        candidates.push({ id: made[i].id, name: made[i].name, object_type: made[i].object_type });
      }
      // Records changed, so the Records tab is stale. Marking it unloaded means
      // the next visit reads the database rather than showing a snapshot from
      // before the change.
      recordsLoaded = false;
      if (d.thread_closed) { closedNotice = true; setState("closed", true); }
      renderStream(false, true);
      return;
    }
    setError = explainSet(res.status, d);
    renderStream(false, true);
  }

  // Words. The correction path: nothing is applied on this turn, by your own
  // decision on 30 July - "yes but" is evidence the summary was already wrong
  // once, so the version you approve should be the corrected one.
  function answerWords(text) {
    busy = true;
    $("send").disabled = true;
    $("box").disabled = true;
    $("stateHint").textContent = "Reading what you said…";
    setError = null;
    turns.push({ role: "user", content: text, created_at: new Date().toISOString() });
    renderStream(true);

    var s = setCards(), ids = [], i;
    for (i = 0; i < s.length; i++) ids.push(s[i].id);

    postTurn({ action: "answer", conversation_id: convId, message: text, record_update_ids: ids })
      .then(function (res) {
        var d = res.data;
        if (d && d.user_message) turns[turns.length - 1] = d.user_message;

        // The model read it as a plain yes, and the Edge Function agreed the
        // reply asked for no change at all.
        if (d && d.action === "applied") { handleApply(res, ids); return; }

        if (d && d.ok === true) {
          if (d.assistant_message) turns.push(d.assistant_message);
          else if (d.reply) turns.push({ role: "assistant", content: d.reply,
                                         created_at: new Date().toISOString() });
          // The fresh set, read back from the database. The paragraph is
          // rebuilt from it - never patched.
          if (Array.isArray(d.record_updates) && d.record_updates.length) cards = d.record_updates;
          else if (Array.isArray(d.record_updates)) cards = d.record_updates;
          if (Array.isArray(d.candidates) && d.candidates.length) candidates = d.candidates;
          if (d.thread_closed) { closedNotice = true; setState("closed", true); }
          renderStream(false);
          return;
        }
        renderStream(false);
        systemNote(explain(res.status, d), true);
      })
      .catch(function (err) {
        renderStream(false);
        if (err && /session_expired|not_signed_in/.test(err.message)) { sessionDead(); return; }
        systemNote("Could not reach the server. Nothing was changed and nothing was applied.", true);
      })
      .then(function () {
        busy = false;
        $("box").disabled = false;
        $("send").disabled = !$("box").value.trim();
        if ($("stateHint").textContent === "Reading what you said…") setState(null);
        $("box").focus();
      });
  }

  // The pulled-out question - a move to Won or Dropped, asked on its own. These
  // are the per-item functions from Session 6, unchanged: approving changes a
  // record and writes an event, rejecting changes nothing and deliberately
  // writes no event.
  function decide(id, mode) {
    var c = findCard(id);
    if (!c) return;
    delete cardError[id];
    var fn, args;
    if (mode === "reject") {
      fn = "chat_reject_record_update";
      args = { p_record_update_id: id };
    } else {
      fn = "chat_apply_record_update";
      args = { p_record_update_id: id, p_final_change: null,
               p_target_object_id: targetFor(c), p_edits: null };
    }
    setCardBusy(id, true);
    return rpc(fn, args).then(function (d) {
      setCardBusy(id, false);
      if (d && d.ok === true) {
        c.status = mode === "reject" ? "rejected" : "applied";
        if (mode !== "reject") recordsLoaded = false;
        if (d.thread_closed) { closedNotice = true; setState("closed", true); }
        renderStream(false, true);
        return true;
      }
      cardError[id] = explainDecision(d);
      renderStream(false, true);
      return false;
    }).catch(function (err) {
      setCardBusy(id, false);
      if (err && /session_expired|not_signed_in/.test(err.message)) { sessionDead(); return false; }
      cardError[id] = "Could not reach the server. Nothing was changed. (" + err.message + ")";
      renderStream(false, true);
      return false;
    });
  }

  // Every refusal of a whole set gets a sentence that says what happened and,
  // above all, that nothing was written. A refusal here is never partial.
  function explainSet(status, d) {
    var e = d && d.error;
    if (e === "set_stale")
      return "Something else is waiting on a decision in this conversation that the summary " +
             "above does not mention, so I have not applied any of it — a yes has to cover " +
             "everything you were shown. Nothing was changed. Reload and I will read the whole " +
             "thing back.";
    if (e === "must_ask_individually")
      return "That set contained a change of deal status, which is always asked on its own and " +
             "never folded into a summary. None of it was applied and nothing was changed.";
    if (e === "unreadable_set")
      return "One of those changes has nothing written to describe it, so it cannot be part of " +
             "something you approve by reading. Nothing was applied.";
    if (e === "unresolved_entity")
      return "One of those changes is not attached to any record, so applying it would change " +
             "nothing. None of the set was applied.";
    if (e === "nothing_pending")
      return "There was nothing still waiting on a decision, so nothing was applied a second time.";
    if (e === "no_workspace")
      return "This account is signed in but has no person-record in a workspace, so it cannot " +
             "write anything. That is a correct refusal, not a fault.";
    if (status === 401)
      return "Your sign-in had expired, so that did not go through and nothing was changed. " +
             "Try again — the session has been renewed.";
    return "That was refused (" + (e || ("HTTP " + status)) + ") and nothing was changed.";
  }

  // Every refusal gets a sentence a person can act on, and every one of them
  // says whether anything was written.
  function explainDecision(d) {
    var e = d && d.error;
    if (e === "unresolved_entity")
      return "This is not attached to any record yet, so approving it would change nothing. " +
             "Choose a record above, or reject it. Nothing was written.";
    if (e === "already_decided")
      return "You have already decided this one (it is now " + (d.current_status || "decided") +
             "). Nothing was written a second time.";
    if (e === "not_found")
      return "That proposed change is not visible to this account. Nothing was written.";
    return "The change was refused (" + (e || "unknown") + "). Nothing was written.";
  }

  // Every failure gets a plain sentence and, where it matters, says whether
  // the message was saved. Silence is the one thing not allowed.
  function explain(status, d) {
    var e = d && d.error;
    if (status === 401)
      return "Your sign-in had expired, so that did not go through. Nothing was written. " +
             "Send it again — the session has been renewed.";
    if (e === "empty_message")   return "There was nothing in that message, so nothing was saved.";
    if (e === "no_workspace")    return "This account is signed in but has no person-record in a workspace, so it cannot read or write anything. That is a correct refusal, not a fault.";
    if (e === "not_signed_in")   return "Your session has expired. Sign out and back in.";
    if (e === "model_response_unparseable" || e === "model_call_failed" || e === "model_unreachable")
      return "Your message was saved, but the interpretation step failed, so nothing was written to the conversation. Send it again.";
    if (e === "invalid_response")  return "Your message was saved. The reply came back in a shape the database refused to store, so the conversation was left untouched.";
    if (e === "conversation_not_found") return "Your message was saved, but the conversation it belongs to is already closed. Start a new one.";
    if (e === "server_not_configured")  return "The server is missing its Anthropic key. Nothing was saved.";
    // REFUSAL S9-4, the broken empty case, and it must not read like the honest
    // one. This is the 31 July failure, said out loud: the system promised to
    // turn an update into proposed changes and had nothing of it left. It says
    // plainly that something went wrong, that nothing was written, and what to
    // do — because on a real Tuesday the alternative is assuming it landed.
    if (e === "no_facts_to_generate")
      return "Something went wrong: I do not have any of what you told me in this thread, so I " +
             "have not written anything and I have not proposed anything. Nothing on your records " +
             "has changed. Please send that update again — this thread is still open.";
    if (e === "not_awaiting_generation")
      return "This conversation is not waiting on proposed changes, so none were prepared. " +
             "That usually means they have already been worked out once. Nothing was written twice.";
    if (e === "generation_failed")
      return "Your message is saved and the conversation is unchanged, but working out the proposed changes failed. " +
             "Nothing on your records has changed. Say \"go ahead\" again in a new thread to retry.";
    if (e === "invalid_generation")
      return "The proposed changes came back in a shape the database refused to store, so none were written " +
             "and the conversation was left where it was.";
    if (e === "insert_failed")
      return "The proposed changes could not be saved. Nothing on your records has changed.";
    return "Something went wrong (" + (e || ("HTTP " + status)) + "). Nothing was changed.";
  }

  // ---------------------------------------------------------------------------
  // Records tab — loaded on first open, not on sign-in.
  // ---------------------------------------------------------------------------
  function propChips(props) {
    if (!props || typeof props !== "object") return "";
    var out = [], keys = Object.keys(props), i, k, v;
    for (i = 0; i < keys.length && out.length < 4; i++) {
      k = keys[i]; v = props[k];
      if (v === null || v === undefined || v === "") continue;
      if (typeof v === "object") continue;
      v = String(v);
      if (v.length > 60) v = v.slice(0, 57) + "…";
      out.push('<span class="chip"><b>' + escapeHtml(titleCase(k)) + "</b> " + escapeHtml(v) + "</span>");
    }
    return out.length ? '<div class="props">' + out.join("") + "</div>" : "";
  }

  function renderObjects(rows) {
    rows = rows || [];
    var workspaces = {}, groups = {}, order = [], i, r;
    for (i = 0; i < rows.length; i++) {
      r = rows[i];
      workspaces[r.workspace_id] = true;
      if (!groups[r.object_type]) { groups[r.object_type] = []; order.push(r.object_type); }
      groups[r.object_type].push(r);
    }
    var html =
      '<div class="summary"><span class="big">' + rows.length + "</span>" +
      '<span class="lbl">records across ' + order.length + " type" + (order.length === 1 ? "" : "s") + "</span>" +
      '<span class="ws">' + escapeHtml(Object.keys(workspaces).join(", ") || "—") + "</span></div>";

    if (!rows.length) {
      html += '<div class="empty">No records are visible to this account. That is what the ' +
              "database returns when the signed-in user has no person-record in any workspace " +
              "— a correct refusal, not an error.</div>";
      $("records").innerHTML = html;
      return;
    }
    for (i = 0; i < order.length; i++) {
      var type = order[i], list = groups[type], j, items = "";
      for (j = 0; j < list.length; j++) {
        items += "<li><div class=\"nm\">" + escapeHtml(list[j].name) + "</div>" +
                 propChips(list[j].properties) + "</li>";
      }
      html += '<section class="group"><h2 class="gh">' + escapeHtml(titleCase(type)) +
              " <em>· " + list.length + "</em></h2><ul class=\"rows\">" + items + "</ul></section>";
    }
    $("records").innerHTML = html;
  }

  function loadRecords(force) {
    if (recordsLoaded && !force) return;
    recordsLoaded = true;
    apiGet("objects?select=id,object_type,name,properties,workspace_id&order=object_type.asc,name.asc")
      .then(renderObjects)
      .catch(function (err) {
        recordsLoaded = false;
        $("records").innerHTML = '<div class="empty"><strong>Could not load records.</strong><br>' +
                                 escapeHtml(err.message) + "</div>";
      });
  }

  // ---------------------------------------------------------------------------
  // Views
  // ---------------------------------------------------------------------------
  function showLogin(message) {
    $("view-app").classList.remove("on");
    $("view-login").hidden = false;
    var m = $("loginMsg");
    if (message) { m.textContent = message; m.classList.add("show"); }
    else { m.textContent = ""; m.classList.remove("show"); }
    $("loginBtn").disabled = false;
    $("loginBtn").textContent = "Sign in";
  }

  function showApp() {
    $("view-login").hidden = true;
    $("view-app").classList.add("on");
    turns = []; cards = []; candidates = []; closedNotice = false;
    recordsLoaded = false; cardError = {}; generating = false;
    setError = null; setBusy = false; createdIds = {}; createdNames = {}; notices = [];
    held = []; heldStatus = null;
    renderStream(false);
    // ONE request: who I am, my open conversation, its whole transcript, any
    // proposals still waiting on it, and the records a picker could attach to.
    rpc("chat_load_open", {}).then(function (d) {
      if (!d || d.ok !== true) {
        $("whoami").textContent = "signed in";
        systemNote("You are signed in, but this account has no person-record in a workspace, " +
                   "so there is nothing to show and nothing can be saved.", true);
        $("send").disabled = true;
        return;
      }
      $("whoami").textContent = d.who ? (d.who.display_name + " · " + d.who.workspace_id) : "signed in";
      turns = Array.isArray(d.turns) ? d.turns : [];
      cards = Array.isArray(d.record_updates) ? d.record_updates : [];
      candidates = Array.isArray(d.candidates) ? d.candidates : [];
      convId = d.conversation_id || null;
      // Session 10. Closing the laptop mid-thread and coming back must show the
      // same list as before it was closed — otherwise the one thing whose
      // absence was the defect is absent again, for a different reason.
      held = Array.isArray(d.candidate_facts) ? d.candidate_facts : [];
      heldStatus = d.status || null;
      setState(d.status, false);
      renderStream(false);
      if (turns.length) {
        var first = $("stream").firstChild;
        var n = document.createElement("div");
        n.className = "system";
        n.textContent = "Picking up where you left off.";
        $("stream").insertBefore(n, first);
      }
      $("box").focus();
    }).catch(function (err) {
      systemNote("Could not load your conversation. " + err.message, true);
    });
  }

  // ---------------------------------------------------------------------------
  // Wiring
  // ---------------------------------------------------------------------------
  $("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = $("loginBtn");
    btn.disabled = true;
    btn.textContent = "Signing in…";
    $("loginMsg").classList.remove("show");
    signIn($("email").value.trim(), $("password").value).then(function (res) {
      if (res.ok && res.data && res.data.access_token) {
        $("password").value = "";
        saveSession(res.data);
        showApp();
      } else {
        showLogin((res.data && (res.data.error_description || res.data.msg || res.data.message)) || "Sign-in failed.");
      }
    }).catch(function () {
      showLogin("Could not reach the server. Check your connection and try again.");
    });
  });

  $("logoutBtn").addEventListener("click", function () {
    signOut();
    turns = []; cards = []; candidates = [];
    showLogin("Signed out.");
  });

  $("tabChat").addEventListener("click", function () {
    $("tabChat").classList.add("sel"); $("tabRecords").classList.remove("sel");
    $("paneChat").hidden = false; $("paneRecords").hidden = true;
    $("composer").style.display = "";
  });
  $("tabRecords").addEventListener("click", function () {
    $("tabRecords").classList.add("sel"); $("tabChat").classList.remove("sel");
    $("paneRecords").hidden = false; $("paneChat").hidden = true;
    $("composer").style.display = "none";
    loadRecords(false);
  });

  // One listener for every button in the flow, so the question on screen can be
  // re-rendered freely without any of them going dead.
  // One listener for every button in the flow, so the surface can be re-rendered
  // freely without any of them going dead.
  $("stream").addEventListener("click", function (e) {
    if (!e.target.closest) return;
    var b = e.target.closest("[data-act]");
    if (!b) return;
    var id = b.getAttribute("data-id"), act = b.getAttribute("data-act");
    if (act === "yes")          answerYes();
    else if (act === "approve") decide(id, "approve");
    else if (act === "reject")  decide(id, "reject");
  });

  // R5, at the surface as well as in the database: an empty box cannot be sent.
  function grow() {
    var b = $("box");
    b.style.height = "auto";
    b.style.height = Math.min(b.scrollHeight, 180) + "px";
    $("send").disabled = busy || !b.value.trim();
  }
  $("box").addEventListener("input", grow);
  $("box").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); trySend(); }
  });
  $("send").addEventListener("click", trySend);

  // While something is waiting on a decision, what you type is an ANSWER to
  // that, not a new message into the thread. Routing it to the ordinary turn
  // would drop it into Session 7's ladder guard and reply "your decision is
  // outstanding" - which is true, and useless, when the decision is what you
  // were just trying to give.
  function trySend() {
    if (busy || setBusy) return;
    var b = $("box"), text = b.value.trim();
    if (!text) return;
    b.value = ""; grow();
    if (convId && pendingCount() > 0) answerWords(text);
    else sendTurn(text);
  }

  // ---- boot ----------------------------------------------------------------
  // Nothing is fetched before a session exists, so there is no flash of data.
  session = loadSession();
  if (!session) {
    showLogin();
  } else if (!expired(session)) {
    showApp();
  } else if (session.refresh_token) {
    refresh(session.refresh_token).then(function (res) {
      if (res.ok && res.data && res.data.access_token) { saveSession(res.data); showApp(); }
      else { clearSession(); showLogin("Your session expired. Please sign in again."); }
    }).catch(function () {
      clearSession(); showLogin("Your session expired. Please sign in again.");
    });
  } else {
    clearSession();
    showLogin("Your session expired. Please sign in again.");
  }
})();
</script>
</body>
</html>
